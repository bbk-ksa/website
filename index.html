<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayz Female Salon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3b1f2b, #7a4055);
            color: white;
            text-align: center;
            transition: 0.3s;
        }

        .language-switch {
            position: absolute;
            top: 25px;
            right: 30px;
        }

        html[dir="ltr"] .language-switch {
            right: auto;
            left: 30px;
        }

        .language-switch button {
            background: transparent;
            border: 1px solid #f3c6d3;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .language-switch button:hover {
            background: #f3c6d3;
            color: #3b1f2b;
        }

        .container {
            max-width: 750px;
            padding: 50px 30px;
        }

        .logo-ar {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo-en {
            font-size: 22px;
            letter-spacing: 3px;
            color: #f3c6d3;
            margin-bottom: 35px;
        }

        .tagline {
            font-size: 17px;
            color: #e8c9d2;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #f3c6d3;
            margin: 30px auto;
            border-radius: 5px;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
            color: #f1dce3;
            margin-bottom: 25px;
        }

        .contact {
            font-size: 16px;
            color: #e8c9d2;
            margin-top: 35px;
        }

        .contact a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 60px;
            font-size: 13px;
            color: #d9aebc;
        }

        @media (max-width: 600px) {

            .logo-ar {
                font-size: 32px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 17px;
            }

            .language-switch {
                top: 15px;
                right: 15px;
            }

            html[dir="ltr"] .language-switch {
                left: 15px;
                right: auto;
            }

        }

    </style>

</head>

<body>

    <!-- زر تغيير اللغة -->
    <div class="language-switch">
        <button onclick="toggleLanguage()" id="languageButton">
            English
        </button>
    </div>


    <div class="container">

        <div class="logo-ar" id="salonName">
            صالون وايز النسائي
        </div>

        <div class="logo-en">
            WAYZ FEMALE SALON
        </div>

        <div class="tagline" id="tagline">
            الجمال • الأناقة • الثقة
        </div>

        <h1 id="title">
            موقعنا الإلكتروني قريباً
        </h1>

        <div class="line"></div>

        <p id="description">
            نعمل حالياً على تجهيز موقعنا الإلكتروني لنقدم لكم تجربة أجمل وأسهل.
        </p>

        <div class="contact">

            <span id="contactText">
                للاستفسارات والتواصل
            </span>

            <br><br>

            <a href="mailto:info@bbk-ksa.com">
                info@bbk-ksa.com
            </a>

        </div>

        <div class="footer" id="footer">
            © 2026 صالون وايز النسائي. جميع الحقوق محفوظة.
        </div>

    </div>


    <script>

        let currentLanguage = "ar";

        function toggleLanguage() {

            const html = document.documentElement;

            if (currentLanguage === "ar") {

                // English
                currentLanguage = "en";

                html.lang = "en";
                html.dir = "ltr";

                document.getElementById("languageButton").innerText = "العربية";

                document.getElementById("salonName").innerText =
                    "WAYZ FEMALE SALON";

                document.getElementById("tagline").innerText =
                    "Beauty • Elegance • Confidence";

                document.getElementById("title").innerText =
                    "Our Website is Coming Soon";

                document.getElementById("description").innerText =
                    "We are currently preparing our website to bring you a beautiful and seamless experience.";

                document.getElementById("contactText").innerText =
                    "For inquiries and contact";

                document.getElementById("footer").innerText =
                    "© 2026 Wayz Female Salon. All Rights Reserved.";


            } else {

                // Arabic
                currentLanguage = "ar";

                html.lang = "ar";
                html.dir = "rtl";

                document.getElementById("languageButton").innerText = "English";

                document.getElementById("salonName").innerText =
                    "صالون وايز النسائي";

                document.getElementById("tagline").innerText =
                    "الجمال • الأناقة • الثقة";

                document.getElementById("title").innerText =
                    "موقعنا الإلكتروني قريباً";

                document.getElementById("description").innerText =
                    "نعمل حالياً على تجهيز موقعنا الإلكتروني لنقدم لكم تجربة أجمل وأسهل.";

                document.getElementById("contactText").innerText =
                    "للاستفسارات والتواصل";

                document.getElementById("footer").innerText =
                    "© 2026 صالون وايز النسائي. جميع الحقوق محفوظة.";

            }

        }

    </script>

</body>
</html>
