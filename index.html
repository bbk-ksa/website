<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBK Saudi Arabia | Under Construction</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 50px 30px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .logo span {
            color: #38bdf8;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .line {
            width: 80px;
            height: 4px;
            background: #38bdf8;
            margin: 30px auto;
            border-radius: 5px;
        }

        .contact {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 40px;
        }

        .contact a {
            color: #38bdf8;
            text-decoration: none;
        }

        .footer {
            margin-top: 60px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">BBK<span>KSA</span></div>

        <h1>Website Under Construction</h1>

        <div class="line"></div>

        <p>
            Our website is currently under development.<br>
            We will be launching soon.
        </p>

        <div class="contact">
            For inquiries, please contact us at<br>
            <a href="mailto:info@bbk-ksa.com">info@bbk-ksa.com</a>
        </div>

        <div class="footer">
            © 2026 BBK Saudi Arabia. All Rights Reserved.
        </div>
    </div>

</body>
</html>
